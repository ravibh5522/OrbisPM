# ============================================================
# OrbisPM — PostgreSQL
# ============================================================
# Included by docker-compose.yml. Can be removed from includes
# if using an external PostgreSQL instance.
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_MAPPED_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orbispm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbispm}
      POSTGRES_DB: ${POSTGRES_DB:-orbispm}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orbispm}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
