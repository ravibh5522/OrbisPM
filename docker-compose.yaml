# ============================================================
# OrbisPM — Single Docker Compose
# ============================================================
#
# Local dev  : docker compose --env-file .env.local --profile local up -d
# Production : docker compose --env-file .env.production up -d
#
# Profiles:
#   local — postgres, redis, minio, zitadel, mailpit (local Docker infra).
#            Skip in production; remote cloud services used instead.
#
# Ports exposed:
#   8000  Kong  (API / WS / NocoDB / mail UI all route through here)
#   3000  Frontend
#   9000  MinIO local only — browser needs direct access for presigned URLs
# ============================================================
include:
  - path: monitoring/docker-compose.yml

services:
  # ══════════════════════════════════════════════════════════
  # LOCAL INFRASTRUCTURE  (profile: local)
  # ══════════════════════════════════════════════════════════

  postgres:
    profiles: [local]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-orbispmdev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-orbispmdev}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    profiles: [local]
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      # Host-side 9020/9021, not 9000/9001 — those are already taken by
      # another project's MinIO on this shared machine. Container-internal
      # port stays 9000/9001 (that's what MinIO itself listens on and what
      # MINIO_ENDPOINT=minio:9000 / this healthcheck already correctly use).
      - "9020:9000" # S3 API — browser needs direct access for presigned URLs
      - "9021:9001" # Console — exposed so Cloudflare tunnel (host-based) can reach it
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
      # Required when MinIO is behind a reverse proxy / Cloudflare tunnel.
      # Without these MinIO generates pre-signed URLs using the internal
      # Docker network address (172.18.x.x:9000) which is unreachable externally.
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_CONSOLE_URL:-}
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # AFFiNE's own dedicated Postgres — not the shared orbispmdev instance.
  # AFFiNE hard-requires the pgvector extension (vector(1024) columns) that
  # the shared postgres:16-alpine image doesn't have; isolating it here is
  # a smaller blast radius than upgrading the image everything else depends on.
  affine-postgres:
    profiles: [local]
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AFFINE_DB_USERNAME:-affine}
      POSTGRES_PASSWORD: ${AFFINE_DB_PASSWORD:?AFFINE_DB_PASSWORD required}
      POSTGRES_DB: ${AFFINE_DB_DATABASE:-affine}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - affinedata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${AFFINE_DB_USERNAME:-affine} -d ${AFFINE_DB_DATABASE:-affine}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # AFFiNE's own Redis — a dedicated container, not the shared one. Unlike
  # our own Go services, AFFiNE's config surface only exposes
  # REDIS_SERVER_HOST (no DB-index selection), so pointing it at the shared
  # redis would risk its cache keys colliding with api/messaging-service's
  # existing /0 usage. One more small container is cheaper than that risk.
  affine-redis:
    profiles: [local]
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Decommissioned 2026-07-21 (research/orbispm-integration-plan.md in Research_g): OrbisPM now
  # points at Research_g's centralized Zitadel instead (see ZITADEL_* vars in .env.local). Kept
  # here, not deleted, in case of rollback — profile renamed so `--profile local up` never starts
  # it. Manually run with `--profile legacy-local-zitadel` if you ever need it back temporarily.
  zitadel:
    profiles: [legacy-local-zitadel]
    image: ghcr.io/zitadel/zitadel:v4.12.1
    restart: unless-stopped
    user: "0"
    command: start-from-init --masterkey "${ZITADEL_MASTERKEY:-MasterkeyNeedsToHave32Characters}"
    ports:
      - "8081:8080" # always bind 8081; in prod Coolify proxies 443→8081
    environment:
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_EXTERNAL_DOMAIN:-localhost}
      ZITADEL_EXTERNALPORT: ${ZITADEL_EXTERNAL_PORT:-8081}
      ZITADEL_EXTERNALSECURE: "${ZITADEL_EXTERNAL_SECURE:-false}"
      ZITADEL_TLS_ENABLED: "false"

      ZITADEL_DATABASE_POSTGRES_HOST: ${ZITADEL_DB_HOST:-postgres}
      ZITADEL_DATABASE_POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      ZITADEL_DATABASE_POSTGRES_DATABASE: ${POSTGRES_DB:-orbispmdev}
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${POSTGRES_USER:-postgres}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:-}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: ${ZITADEL_DB_SSL_MODE:-disable}
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${POSTGRES_USER:-postgres}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${POSTGRES_PASSWORD:-}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: ${ZITADEL_DB_SSL_MODE:-disable}
      ZITADEL_DATABASE_POSTGRES_MAXOPENCONNS: 20
      ZITADEL_DATABASE_POSTGRES_MAXIDLECONNS: 10
      ZITADEL_DATABASE_POSTGRES_CONNMAXLIFETIME: "1h"
      ZITADEL_DATABASE_POSTGRES_CONNMAXIDLETIME: "5m"
      ZITADEL_DATABASE_POSTGRES_DIALER_TIMEOUT: "30s"

      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_ADMIN_USER:-admin@orbispm.local}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: "${ZITADEL_ADMIN_PASSWORD:-Admin123!}"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_NAME: ${ZITADEL_ORG_NAME:-OrbisPM}
      ZITADEL_FIRSTINSTANCE_INSTANCENAME: ${ZITADEL_INSTANCE_NAME:-OrbisPM}
      ZITADEL_FIRSTINSTANCE_DEFAULTLANGUAGE: en
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: ${ZITADEL_MACHINE_USERNAME:-backend-service}
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: "${ZITADEL_MACHINE_NAME:-OrbisPM Backend}"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "${ZITADEL_MACHINE_PAT_EXPIRY:-2030-01-01T00:00:00Z}"

      ZITADEL_CACHES_CONNECTORS_REDIS_ENABLED: "true"
      ZITADEL_CACHES_CONNECTORS_REDIS_ADDR: "redis:6379"
      ZITADEL_CACHES_INSTANCE_CONNECTOR: redis
      ZITADEL_CACHES_MILESTONES_CONNECTOR: redis
      ZITADEL_CACHES_ORGANIZATION_CONNECTOR: redis

      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: "false"
      ZITADEL_LOG_LEVEL: ${ZITADEL_LOG_LEVEL:-info}
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
      # Increase eventstore push timeout for remote DB with high RTT (default 15s)
      ZITADEL_EVENTSTORE_PUSHTIMEOUT: "600s"
      ZITADEL_EVENTSTORE_MAXRETRIES: 15
      # Settings previously in zitadel-config.yaml
      ZITADEL_SYSTEMDEFAULTS_MULTIFACTORS_OTP_ISSUER: "OrbisPM"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 30
      start_period: 120s

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["--jetstream", "--store_dir=/data", "-m", "8222"]
    expose:
      - "4222"
      - "8222"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Decommissioned in favor of Research_g's centralized Mailpit
  # (research/centralized-mail-plan.md in Research_g) — profile renamed rather
  # than deleted so it's inert but recoverable, same treatment as the old
  # local Zitadel below.
  mailpit:
    profiles: [legacy-local-mailpit]
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_WEBROOT: /mail/
    expose:
      - "8025" # web UI — access via Kong at /mail
      - "1025" # SMTP — internal only
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ══════════════════════════════════════════════════════════
  # APPLICATION SERVICES  (always on)
  # ══════════════════════════════════════════════════════════

  # ── PgBouncer — connection pooler between app and RDS ──
  # Keeps hot connections to RDS so apps avoid ~2s SSL handshake per new connection.
  # session mode: compatible with RLS set_config() and pgx prepared-statement cache.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    # Unset DATABASE_URL so the entrypoint uses individual DB_* env vars.
    # This avoids two issues:
    # 1) Coolify injects DATABASE_URL=<url>?sslmode=require globally — the query
    #    string becomes part of DB_NAME and produces an invalid pgbouncer.ini line.
    # 2) In local dev, DATABASE_URL has "localhost" which resolves to the pgbouncer
    #    container itself instead of the postgres Docker service.
    # Also rewrite DB_HOST=localhost → postgres (Docker service name) for local dev.
    # We pass the CMD explicitly (/usr/bin/pgbouncer ...) because the image uses
    # ENTRYPOINT+CMD pattern and exec "$@" in the wrapper script needs args.
    entrypoint:
      - "sh"
      - "-c"
      - 'unset DATABASE_URL; [ "$$DB_HOST" = localhost ] && export DB_HOST=postgres; exec /entrypoint.sh /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini'
    expose:
      - "5432"
    environment:
      DB_HOST: ${POSTGRES_HOST:-postgres}
      DB_PORT: ${POSTGRES_PORT:-5432}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-orbispmdev}
      POOL_MODE: session
      # Match the API's MaxConns (25) + headroom for other services.
      # RDS max_connections=79; Zitadel uses ~10, so cap server connections at 30.
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 10
      MAX_CLIENT_CONN: 400
      RESERVE_POOL_SIZE: 5
      # Close idle server connections after 5 min to free RDS slots.
      SERVER_IDLE_TIMEOUT: 300
      SERVER_CONNECT_TIMEOUT: 15
      # Recycle server connections every 30 min to pick up new SSL certs / config.
      SERVER_LIFETIME: 1800
      CLIENT_IDLE_TIMEOUT: 600
      # Hard cap on total server-side connections from this pgbouncer instance.
      # RDS max_connections=79; leave 20 for Zitadel + admin.
      MAX_DB_CONNECTIONS: 55
      AUTH_TYPE: plain
      # SSL from PgBouncer to RDS; client→PgBouncer is plain (Docker-internal)
      SERVER_TLS_SSLMODE: ${POSTGRES_SSL_MODE:-disable}
      # Ignore extra startup params sent by pgx / psycopg
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
    healthcheck:
      # pg_isready only performs the protocol handshake — no password, no auth.
      # Returns 0 as soon as PgBouncer accepts TCP connections on port 5432.
      # Falls back to /proc/net/tcp port check if pg_isready is absent in the image.
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -q 2>/dev/null || grep -q ':1538 ' /proc/net/tcp 2>/dev/null || grep -q ':1538 ' /proc/net/tcp6 2>/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  meilisearch:
    image: getmeili/meilisearch:v1.7
    restart: unless-stopped
    expose:
      - "7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterkey-for-dev-only}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    deploy:
      replicas: ${API_REPLICAS:-1}
    expose:
      - "8080"
    environment:
      PORT: ${API_PORT:-8080}
      ENV: ${APP_ENV:-development}
      # Route through PgBouncer (session mode) to avoid per-request RDS connection overhead.
      # sslmode=disable: app→pgbouncer is Docker-internal; pgbouncer→RDS handles SSL.
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      ZITADEL_DOMAIN: ${ZITADEL_DOMAIN:?ZITADEL_DOMAIN required}
      ZITADEL_ISSUER: ${ZITADEL_ISSUER:?ZITADEL_ISSUER required}
      ZITADEL_INTERNAL_URL: ${ZITADEL_INTERNAL_URL:-http://zitadel:8080}
      ZITADEL_SERVICE_TOKEN: ${ZITADEL_SERVICE_TOKEN:?ZITADEL_SERVICE_TOKEN required}
      ZITADEL_CLIENT_ID: ${ZITADEL_CLIENT_ID:?ZITADEL_CLIENT_ID required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-orbispm}
      MINIO_DRIVE_BUCKET: ${MINIO_DRIVE_BUCKET:-orbispm-drive}
      DRIVE_MAX_FILE_MB: ${DRIVE_MAX_FILE_MB:-100}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:?MINIO_PUBLIC_URL required}
      MEILI_URL: "http://meilisearch:7700"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterkey-for-dev-only}
      AFFINE_INTERNAL_URL: ${AFFINE_INTERNAL_URL:-http://affine:3010}
      AFFINE_PUBLIC_URL: ${AFFINE_PUBLIC_URL:-http://localhost:3010}
      AFFINE_ADMIN_EMAIL: ${AFFINE_ADMIN_EMAIL:-}
      AFFINE_ADMIN_PASSWORD: ${AFFINE_ADMIN_PASSWORD:-}
      AFFINE_BRIDGE_URL: ${AFFINE_BRIDGE_URL:-http://affine-bridge:8085}
      AFFINE_USER_SECRET: ${AFFINE_USER_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-noreply@orbispm.local}
      SMTP_ENABLED: ${SMTP_ENABLED:-true}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-100}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-20}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_ENABLED: ${STRIPE_ENABLED:-false}
      WRITE_TIMEOUT_SECONDS: ${WRITE_TIMEOUT_SECONDS:-60}
      READ_TIMEOUT_SECONDS: ${READ_TIMEOUT_SECONDS:-60}
    depends_on:
      meilisearch:
        condition: service_healthy
      pgbouncer:
        # service_started: pgx lazily retries connections — no need to block on healthcheck.
        # Avoids deployment failure if PgBouncer healthcheck is slow on Coolify.
        condition: service_started
      # optional — only present when running with --profile local
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
      zitadel:
        condition: service_healthy
        required: false
    networks:
      - default
      - crewsity_appnet
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kong:
    build:
      context: .
      dockerfile: kong/Dockerfile
    restart: unless-stopped
    ports:
      - "${KONG_PROXY_PORT:-8000}:8000"
      - "${KONG_SSL_PORT:-8443}:8443"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      KONG_STATUS_LISTEN: "0.0.0.0:8100"
      KONG_LOG_LEVEL: ${KONG_LOG_LEVEL:-info}
      # Use Docker's embedded DNS so Kong resolves service names like "api" correctly.
      KONG_DNS_RESOLVER: "127.0.0.11"
      # Reduce stale DNS TTL so failed lookups are retried quickly after a
      # service restarts (default is 4s; 1s recovers faster).
      KONG_DNS_STALE_TTL: "1"
    depends_on:
      api:
        condition: service_healthy
      messaging-service:
        condition: service_started

  email-service:
    build:
      context: ./email-service
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8050"
    environment:
      EMAIL_SMTP_HOST: ${SMTP_HOST:-mailpit}
      EMAIL_SMTP_PORT: ${SMTP_PORT:-1025}
      EMAIL_SMTP_USER: ${SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_SMTP_FROM: ${SMTP_FROM:-noreply@orbispm.local}
      EMAIL_SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      EMAIL_SMTP_START_TLS: ${SMTP_START_TLS:-false}
      EMAIL_REDIS_URL: ${EMAIL_REDIS_URL:?EMAIL_REDIS_URL required}
      EMAIL_API_KEY: ${EMAIL_SERVICE_API_KEY:-email-service-dev-key}
      EMAIL_FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    networks:
      - default
      - crewsity_appnet
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8050/api/v1/email/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  email-worker:
    build:
      context: ./email-service
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["arq", "app.services.queue.WorkerSettings"]
    networks:
      - default
      - crewsity_appnet
    environment:
      EMAIL_SMTP_HOST: ${SMTP_HOST:-mailpit}
      EMAIL_SMTP_PORT: ${SMTP_PORT:-1025}
      EMAIL_SMTP_USER: ${SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_SMTP_FROM: ${SMTP_FROM:-noreply@orbispm.local}
      EMAIL_SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      EMAIL_SMTP_START_TLS: ${SMTP_START_TLS:-false}
      EMAIL_REDIS_URL: ${EMAIL_REDIS_URL:?EMAIL_REDIS_URL required}
      EMAIL_FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      redis:
        condition: service_healthy

  messaging-service:
    build:
      context: ./messaging-service
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8082"
    environment:
      PORT: ${MSG_PORT:-8082}
      ENV: ${APP_ENV:-development}
      # Route through PgBouncer to avoid per-request RDS connection overhead
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-orbispmdev}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      ZITADEL_ISSUER: ${ZITADEL_ISSUER:?ZITADEL_ISSUER required}
      ZITADEL_INTERNAL_URL: ${ZITADEL_INTERNAL_URL:-http://zitadel:8080}
      ZITADEL_CLIENT_ID: ${ZITADEL_CLIENT_ID:?ZITADEL_CLIENT_ID required}
      ZITADEL_SERVICE_TOKEN: ${ZITADEL_SERVICE_TOKEN:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-orbispm-chat}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:?MINIO_PUBLIC_URL required}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    depends_on:
      nats:
        condition: service_healthy
      pgbouncer:
        # service_started: pgx lazily retries connections — no need to block on healthcheck.
        condition: service_started
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
      zitadel:
        condition: service_healthy
        required: false
    networks:
      - default
      - crewsity_appnet

  # AFFiNE — self-hosted doc+canvas app, embedded in the project Canvas tab.
  # See research/reactive-crunching-noodle plan: full app (not just the
  # BlockSuite editor library), integrated at the edges — SSO via the same
  # Zitadel instance, own Postgres/Redis, routed through Kong.
  affine-migrate:
    profiles: [local]
    image: ghcr.io/toeverything/affine:${AFFINE_REVISION:-stable}
    command: ["sh", "-c", "node ./scripts/self-host-predeploy.js"]
    environment:
      REDIS_SERVER_HOST: affine-redis
      DATABASE_URL: postgresql://${AFFINE_DB_USERNAME:-affine}:${AFFINE_DB_PASSWORD}@affine-postgres:5432/${AFFINE_DB_DATABASE:-affine}
      AFFINE_INDEXER_ENABLED: "false"
    volumes:
      - affineuploads:/root/.affine/storage
      - affineconfig:/root/.affine/config
    depends_on:
      affine-postgres:
        condition: service_healthy
      affine-redis:
        condition: service_healthy

  affine:
    profiles: [local]
    image: ghcr.io/toeverything/affine:${AFFINE_REVISION:-stable}
    restart: unless-stopped
    ports:
      # Published directly, same pattern as zitadel (its own port, not
      # routed through Kong) — simpler than making AFFiNE aware of a Kong
      # sub-path prefix, and confirmed it sends no X-Frame-Options/CSP
      # header by default, so direct iframing from the frontend just works.
      - "3010:3010"
    environment:
      REDIS_SERVER_HOST: affine-redis
      DATABASE_URL: postgresql://${AFFINE_DB_USERNAME:-affine}:${AFFINE_DB_PASSWORD}@affine-postgres:5432/${AFFINE_DB_DATABASE:-affine}
      AFFINE_INDEXER_ENABLED: "false"
      # External-URL / sub-path config (needed to route AFFiNE through Kong
      # on OrbisPM's own origin) is deliberately NOT set yet — get the base
      # deployment running and confirmed working first, then research the
      # real config keys for that as its own step, instead of guessing here.
    volumes:
      - affineuploads:/root/.affine/storage
      - affineconfig:/root/.affine/config
    depends_on:
      affine-postgres:
        condition: service_healthy
      affine-redis:
        condition: service_healthy
      affine-migrate:
        condition: service_completed_successfully
    healthcheck:
      # No documented HTTP health endpoint — a plain TCP-reachability check
      # is the community-standard approach for this image.
      test: ["CMD-SHELL", "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/3010' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - default
      - crewsity_appnet

  # Creates AFFiNE docs for the API. AFFiNE has no createDoc GraphQL mutation;
  # docs only exist once pushed over its socket.io sync protocol, which this
  # sidecar speaks (see affine-bridge/server.mjs). Holds the AFFiNE admin
  # session, so it is deliberately on the default network only — no published
  # port and not on the shared crewsity_appnet.
  affine-bridge:
    profiles: [local]
    build: ./affine-bridge
    restart: unless-stopped
    environment:
      AFFINE_INTERNAL_URL: http://affine:3010
      AFFINE_ADMIN_EMAIL: ${AFFINE_ADMIN_EMAIL:-}
      AFFINE_ADMIN_PASSWORD: ${AFFINE_ADMIN_PASSWORD:-}
    depends_on:
      affine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8085/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - default

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
        NEXT_PUBLIC_APP_NAME: ${APP_NAME:-OrbisPM}
        NEXT_PUBLIC_GOOGLE_IDP_ID: ${GOOGLE_IDP_ID:-371632718112358914}
        NEXT_PUBLIC_GITHUB_IDP_ID: ${GITHUB_IDP_ID:-371633241645384194}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - kong

networks:
  # Bridges to Research_g's centralized Zitadel (research/orbispm-integration-plan.md
  # in that repo). External: created by Research_g's own docker-compose.yml,
  # not owned by this project — don't add this network's lifecycle here.
  crewsity_appnet:
    external: true
    name: sample-app_appnet

volumes:
  pgdata:
  redisdata:
  miniodata:
  meilidata:
  natsdata:
  affinedata:
  affineuploads:
  affineconfig:
