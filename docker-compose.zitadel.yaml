# ============================================================
# OrbisPM — Zitadel v4.12.1 (Identity Provider)
# ============================================================
# Two containers: zitadel-redis + zitadel
# Uses AWS RDS PostgreSQL + local Redis for caching.
# Run: docker compose -f docker-compose.zitadel.yaml --env-file .env.production up -d
# ============================================================

services:
  zitadel-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.12.1
    restart: unless-stopped
    user: "0"
    command: >-
      start
      --masterkey "${ZITADEL_MASTERKEY}"
      --config /zitadel-caches.yaml
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      # ── Networking ──
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_EXTERNAL_DOMAIN:-zitadel.orbispm.in}
      ZITADEL_EXTERNALPORT: ${ZITADEL_EXTERNAL_PORT:-443}
      ZITADEL_EXTERNALSECURE: "true"
      ZITADEL_TLS_ENABLED: "false"

      # ── Database (AWS RDS) ──
      ZITADEL_DATABASE_POSTGRES_HOST: ${POSTGRES_HOST}
      ZITADEL_DATABASE_POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      ZITADEL_DATABASE_POSTGRES_DATABASE: ${POSTGRES_DB:-orbispmdev}
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${POSTGRES_USER}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${POSTGRES_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: ${POSTGRES_SSL_MODE:-require}
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${POSTGRES_USER}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: ${POSTGRES_SSL_MODE:-require}

      # ── Features ──
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"

      # ── Database connection pool (tuned for remote RDS) ──
      ZITADEL_DATABASE_POSTGRES_MAXOPENCONNS: 25
      ZITADEL_DATABASE_POSTGRES_MAXIDLECONNS: 10
      ZITADEL_DATABASE_POSTGRES_MAXCONNLIFETIME: "30m"
      ZITADEL_DATABASE_POSTGRES_MAXCONNIDLETIME: "5m"

      # ── Projections (tuned for high-latency remote DB) ──
      ZITADEL_PROJECTIONS_TRANSACTIONDURATION: "300s"
      ZITADEL_PROJECTIONS_BULKLIMIT: 100
      ZITADEL_PROJECTIONS_MAXFAILURECOUNT: 50
      ZITADEL_PROJECTIONS_RETRYFAILEDAFTER: "30s"
      # Override per-projection customizations (defaults.yaml sets these to 2s)
      ZITADEL_PROJECTIONS_CUSTOMIZATIONS_PASSWORD_COMPLEXITIES_TRANSACTIONDURATION: "120s"
      ZITADEL_PROJECTIONS_CUSTOMIZATIONS_LOCKOUT_POLICY_TRANSACTIONDURATION: "120s"

      # ── Eventstore ──
      ZITADEL_EVENTSTORE_PUSHTIMEOUT: "120s"
      ZITADEL_EVENTSTORE_MAXRETRIES: 5

      # ── Logging ──
      ZITADEL_LOG_LEVEL: info
      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: "false"

    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 30
      start_period: 120s
    ports:
      - "${ZITADEL_MAPPED_PORT:-8081}:8080"
    volumes:
      - ./zitadel-caches.yaml:/zitadel-caches.yaml:ro
    depends_on:
      zitadel-redis:
        condition: service_healthy
