# ============================================================
# OrbisPM — Zitadel v4 (Identity Provider)
# ============================================================
# Standalone compose (deployed separately from main stack).
# Uses external PostgreSQL and a dedicated internal Redis.
# ============================================================

services:
  zitadel-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  zitadel:
    image: ghcr.io/zitadel/zitadel:${ZITADEL_VERSION:-v4.12.1}
    restart: unless-stopped
    user: "0"
    command: start --masterkey "${ZITADEL_MASTERKEY}"
    depends_on:
      zitadel-redis:
        condition: service_healthy
    ports:
      - "${ZITADEL_MAPPED_PORT:-8081}:8080"
    environment:
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_EXTERNAL_DOMAIN}
      ZITADEL_EXTERNALPORT: ${ZITADEL_EXTERNAL_PORT:-443}
      ZITADEL_EXTERNALSECURE: "${ZITADEL_EXTERNAL_SECURE:-true}"
      ZITADEL_TLS_ENABLED: false

      ZITADEL_DATABASE_POSTGRES_HOST: ${POSTGRES_HOST}
      ZITADEL_DATABASE_POSTGRES_PORT: ${POSTGRES_PORT}
      ZITADEL_DATABASE_POSTGRES_DATABASE: ${POSTGRES_DB}
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${POSTGRES_USER}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: ${POSTGRES_SSL_MODE:-disable}
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${POSTGRES_USER}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${POSTGRES_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: ${POSTGRES_SSL_MODE:-disable}
      ZITADEL_DATABASE_POSTGRES_MAXOPENCONNS: 40
      ZITADEL_DATABASE_POSTGRES_MAXIDLECONNS: 20
      ZITADEL_DATABASE_POSTGRES_CONNMAXLIFETIME: "1h"
      ZITADEL_DATABASE_POSTGRES_CONNMAXIDLETIME: "5m"
      ZITADEL_DATABASE_POSTGRES_DIALER_TIMEOUT: "60s"

      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_ADMIN_USER:-admin@orbispm.local}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:-Admin123!}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: false
      ZITADEL_FIRSTINSTANCE_ORG_NAME: ${ZITADEL_ORG_NAME:-OrbisPM}
      ZITADEL_FIRSTINSTANCE_INSTANCENAME: ${ZITADEL_INSTANCE_NAME:-OrbisPM}
      ZITADEL_FIRSTINSTANCE_DEFAULTLANGUAGE: en
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: ${ZITADEL_MACHINE_USERNAME:-backend-service}
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: ${ZITADEL_MACHINE_NAME:-OrbisPM Backend}
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: ${ZITADEL_MACHINE_PAT_EXPIRY:-2030-01-01T00:00:00Z}

      # Use built-in Login v1 (no separate login container needed)
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: false

      # Redis caching disabled — plain Redis 7 lacks maint_notifications,
      # causing circuit breaker to open and overload remote Postgres.
      ZITADEL_CACHES_CONNECTORS_REDIS_ENABLED: false
      # ZITADEL_CACHES_CONNECTORS_REDIS_ADDR: "zitadel-redis:6379"
      # ZITADEL_CACHES_INSTANCE_CONNECTOR: redis
      # ZITADEL_CACHES_MILESTONES_CONNECTOR: redis
      # ZITADEL_CACHES_ORGANIZATION_CONNECTOR: redis

      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: false
      ZITADEL_LOG_LEVEL: ${ZITADEL_LOG_LEVEL:-info}

      # Increase eventstore push timeout for remote DB (default 15s)
      ZITADEL_EVENTSTORE_PUSHTIMEOUT: "600s"
      ZITADEL_EVENTSTORE_MAXRETRIES: 10
      # Settings previously in zitadel-config.yaml
      ZITADEL_SYSTEMDEFAULTS_MULTIFACTORS_OTP_ISSUER: "OrbisPM"

      # Projection timeouts — increase for high-latency remote DB
      ZITADEL_PROJECTIONS_HANDLETIMEOUT: "300s"
      ZITADEL_PROJECTIONS_TRANSACTIONDURATION: "300s"
      ZITADEL_PROJECTIONS_BULKLIMIT: 50
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 30
      start_period: 600s
