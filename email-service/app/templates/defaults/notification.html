<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="format-detection" content="telephone=no,address=no,email=no,date=no,url=no">
  <!--[if mso]><noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript><![endif]-->
  <title>{{ title }} &mdash; {{ org_name | default(app_name) }}</title>
  <style>
    @media only screen and (max-width:600px) {
      .wrap { padding: 20px 12px 32px !important; }
      .pad { padding: 22px 20px 26px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#f8f9fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
  <div style="display:none;font-size:1px;color:#f8f9fb;line-height:1px;max-height:0;overflow:hidden;mso-hide:all;">{{ title }} &mdash; {{ org_name | default(app_name) }}</div>

  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f8f9fb;">
    <tr>
      <td align="center" class="wrap" style="padding:36px 16px 48px;">
        <!--[if mso]><table role="presentation" width="540" cellspacing="0" cellpadding="0" border="0" align="center"><tr><td><![endif]-->
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:540px;">

          <!-- Org header -->
          <tr>
            <td style="padding-bottom:14px;">
              {% if org_icon %}<img src="{{ org_icon }}" alt="{{ org_name | default(app_name) }}" width="28" height="28" style="display:inline-block;vertical-align:middle;border-radius:6px;border:1px solid #e5e7eb;margin-right:8px;">{% endif %}
              <span style="font-size:13px;font-weight:700;color:#374151;vertical-align:middle;">{{ org_name | default(app_name) }}</span>
            </td>
          </tr>

          <!-- Card — left-accent sidebar style -->
          <tr>
            <td style="background-color:#ffffff;border:1px solid #e5e7eb;border-radius:14px;overflow:hidden;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <!-- Left accent bar -->
                  <td style="background-color:#64748b;width:4px;font-size:0;line-height:0;">&nbsp;</td>
                  <!-- Content -->
                  <td class="pad" style="padding:26px 32px 30px;">
                    <h1 style="margin:0 0 12px;font-size:18px;font-weight:800;color:#111827;line-height:1.35;letter-spacing:-0.3px;">{{ title }}</h1>
                    <p style="margin:0;font-size:14px;color:#374151;line-height:1.75;">{{ body }}</p>

                    {% if cta_url and cta_text %}
                    <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin-top:22px;">
                      <tr>
                        <td style="border-radius:8px;background-color:#64748b;">
                          <a href="{{ cta_url }}" target="_blank" style="display:inline-block;padding:10px 24px;font-size:13px;font-weight:700;color:#ffffff;text-decoration:none;letter-spacing:0.2px;">{{ cta_text }} &rarr;</a>
                        </td>
                      </tr>
                    </table>
                    {% elif cta_url %}
                    <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin-top:22px;">
                      <tr>
                        <td style="border-radius:8px;background-color:#64748b;">
                          <a href="{{ cta_url }}" target="_blank" style="display:inline-block;padding:10px 24px;font-size:13px;font-weight:700;color:#ffffff;text-decoration:none;letter-spacing:0.2px;">View &rarr;</a>
                        </td>
                      </tr>
                    </table>
                    {% endif %}
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding-top:16px;text-align:left;">
              <p style="margin:0;font-size:11px;color:#9ca3af;">Notification from <strong style="color:#6b7280;">{{ org_name | default(app_name) }}</strong>.</p>
            </td>
          </tr>

        </table>
        <!--[if mso]></td></tr></table><![endif]-->
      </td>
    </tr>
  </table>
</body>
</html>
