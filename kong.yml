_format_version: "3.0"
_transform: true

services:
  # Zitadel (external)
  - name: zitadel
    url: https://zitadel.animastuff.fun
    routes:
      - name: zitadel-console
        paths:
          - /zitadel
        strip_path: true
        preserve_host: false

  # SSE endpoint — long-lived streaming, must come BEFORE generic /api route
  - name: backend-sse
    url: http://api:8080
    read_timeout: 86400000
    write_timeout: 86400000
    connect_timeout: 10000
    routes:
      - name: backend-sse-route
        paths:
          - ~/api/v1/orgs/[^/]+/events/stream
        strip_path: false
        preserve_host: false
        regex_priority: 200
    plugins:
      - name: rate-limiting
        config:
          minute: 15
          policy: local
          fault_tolerant: true
          hide_client_headers: false

  # Go Backend API
  - name: backend-api
    url: http://api:8080
    routes:
      - name: backend-api-routes
        paths:
          - /api
        strip_path: false
        preserve_host: false
    plugins:
      - name: rate-limiting
        config:
          minute: 1000
          policy: local
          fault_tolerant: true
          hide_client_headers: false

  # WebSocket endpoint — long-lived, must come BEFORE generic /api route
  - name: backend-ws
    url: http://api:8080
    read_timeout: 86400000
    write_timeout: 86400000
    connect_timeout: 10000
    routes:
      - name: backend-ws-route
        paths:
          - ~/api/v1/orgs/[^/]+/ws$
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        regex_priority: 200
    plugins:
      - name: rate-limiting
        config:
          minute: 30
          policy: local
          fault_tolerant: true
          hide_client_headers: false

  # Storage proxy removed — MinIO is external (HTTPS)
  # Access files directly via MINIO_SERVER_URL

  # NocoDB UI
  - name: nocodb
    url: http://nocodb:8080
    routes:
      - name: nocodb-route
        paths:
          - /db
        strip_path: true
        preserve_host: false
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          policy: local
          fault_tolerant: true
          hide_client_headers: false

plugins:
  - name: cors
    config:
      origins:
        - http://localhost:3000
        - http://localhost:3001
        - https://orbispm.crewsity.com
        - https://www.orbispm.crewsity.com
        - https://orbisom.live
        - https://www.orbisom.live
        - https://orbisom.in
        - https://www.orbisom.in
        - http://xgkwk0wkwg4c8cogg4ow44gk.35.207.238.251.sslip.io
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
        - HEAD
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-Requested-With
        - X-Org-ID
        - apikey
      exposed_headers:
        - X-Total-Count
        - X-Request-Id
        - RateLimit-Limit
        - RateLimit-Remaining
        - RateLimit-Reset
      credentials: true
      max_age: 3600
      preflight_continue: false
