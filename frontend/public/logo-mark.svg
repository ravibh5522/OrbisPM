<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" fill="none">
  <defs>
    <linearGradient id="ringG" x1="30" y1="4" x2="30" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="orbitG" x1="52" y1="8" x2="8" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#818cf8" stop-opacity="1"/>
      <stop offset="65%"  stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4338ca"  stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="oa">
      <path clip-rule="evenodd"
        d="M -4 -4 H 64 V 64 H -4 Z
           M 30 30 m -20 0 a 20 20 0 1 0 40 0 a 20 20 0 1 0 -40 0"/>
    </clipPath>
  </defs>

  <!-- Full faint orbit -->
  <ellipse cx="30" cy="30" rx="25.2" ry="10.2"
    transform="rotate(-30 30 30)"
    stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Ring -->
  <circle cx="30" cy="30" r="16.8" stroke="url(#ringG)" stroke-width="5.4"/>

  <!-- Bright orbit arms -->
  <ellipse cx="30" cy="30" rx="25.2" ry="10.2"
    transform="rotate(-30 30 30)"
    stroke="url(#orbitG)" stroke-width="1.7"
    stroke-linecap="round" clip-path="url(#oa)"/>

  <!-- Satellite -->
  <circle cx="51.8" cy="17.4" r="3.4" fill="#818cf8" fill-opacity="0.2"/>
  <circle cx="51.8" cy="17.4" r="2.6" fill="#6366f1"/>
  <circle cx="51.8" cy="17.4" r="1.15" fill="#e0e7ff"/>
</svg>
