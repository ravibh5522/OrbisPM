<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background: deep indigo gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#5a4ff0"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Ring stroke: white with subtle vertical gradient for soft 3-D roundness -->
    <linearGradient id="ringGrad" x1="50" y1="18" x2="50" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Orbit stroke gradient: fades from bright → dim along its length -->
    <linearGradient id="orbitGrad" x1="86" y1="29" x2="14" y2="71" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="55%"  stop-color="#a5b4fc" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Satellite inner-dot glow -->
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </radialGradient>

    <!--
      Clip region = everything OUTSIDE the ring outer edge (r > 33).
      Used so the "bright front arms" of the orbit only draw where they
      actually extend beyond the ring band, giving clean occlusion.
    -->
    <clipPath id="outerArms">
      <path clip-rule="evenodd"
        d="M -5 -5 H 105 V 105 H -5 Z
           M 50 50 m -33 0 a 33 33 0 1 0 66 0 a 33 33 0 1 0 -66 0"/>
    </clipPath>

    <!-- Subtle drop-shadow for the ring -->
    <filter id="ringBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur"/>
      <feFlood flood-color="#818cf8" flood-opacity="0.45" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── Background rounded square ───────────────────────── -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!--
    Orbit ellipse geometry:
      Center (50,50), rx=42, ry=17, rotated −30°
      Major-axis tips (t=0° and t=180°):
        (86.4, 29.0)  →  upper-right arm
        (13.6, 71.0)  →  lower-left arm
      Ring outer edge ≈ r=33 → ellipse exits ring at t≈44° and t≈136°
  -->

  <!-- ── Layer 1 : full orbit – faint "behind-ring" trace ─── -->
  <ellipse cx="50" cy="50" rx="42" ry="17"
    transform="rotate(-30 50 50)"
    stroke="white" stroke-width="2.2" stroke-opacity="0.22"/>

  <!-- ── Layer 2 : main ring – the bold "O" of Orbis ────── -->
  <circle cx="50" cy="50" r="28"
    stroke="url(#ringGrad)" stroke-width="9"
    filter="url(#ringBloom)"/>

  <!-- ── Layer 3 : bright orbit arms – clipped outside ring ─ -->
  <ellipse cx="50" cy="50" rx="42" ry="17"
    transform="rotate(-30 50 50)"
    stroke="url(#orbitGrad)" stroke-width="2.6"
    stroke-linecap="round"
    clip-path="url(#outerArms)"/>

  <!-- ── Layer 4 : satellite tracking node ─────────────────── -->
  <!-- Outer halo -->
  <circle cx="86" cy="29" r="5.5"  fill="white" fill-opacity="0.18"/>
  <!-- Main dot -->
  <circle cx="86" cy="29" r="4.2"  fill="white" fill-opacity="0.95"/>
  <!-- Inner accent -->
  <circle cx="86" cy="29" r="2.0"  fill="url(#dotGlow)"/>
</svg>
