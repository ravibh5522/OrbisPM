# ============================================================
# OrbisPM — Main Docker Compose
# ============================================================
# All configuration comes from .env (auto-loaded by Compose).
#
# External services (configured in .env):
#   - PostgreSQL  → 35.207.238.251:9000
#   - Redis       → 35.207.238.251:9001
#   - MinIO       → external HTTPS endpoint
#
# Local services:
#   - docker-compose.zitadel.yml   → Zitadel v4 (API + Login + Proxy)
#
# Horizontal scaling:
#   Set API_REPLICAS=N in .env to run N API instances.
#   Kong automatically load-balances via Docker DNS.
# ============================================================

include:
  - docker-compose.zitadel.yml

services:
  meilisearch:
    image: getmeili/meilisearch:v1.7
    restart: unless-stopped
    ports:
      - "${MEILI_PORT:-7700}:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterkey-for-dev-only}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      replicas: ${API_REPLICAS:-1}
    expose:
      - "${API_PORT:-8080}"
    environment:
      PORT: ${API_PORT:-8080}
      ENV: ${APP_ENV:-development}
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=${POSTGRES_SSL_MODE:-disable}"
      REDIS_URL: "redis://${REDIS_USERNAME:-default}:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/0"
      ZITADEL_DOMAIN: "${ZITADEL_EXTERNAL_DOMAIN:-localhost}:${ZITADEL_MAPPED_PORT:-8081}"
      ZITADEL_ISSUER: "http://${ZITADEL_EXTERNAL_DOMAIN:-localhost}:${ZITADEL_MAPPED_PORT:-8081}"
      ZITADEL_INTERNAL_URL: "http://zitadel-proxy:8080"
      ZITADEL_SERVICE_TOKEN: ${ZITADEL_SERVICE_TOKEN:-}
      ZITADEL_CLIENT_ID: ${ZITADEL_CLIENT_ID:-}
      JWT_SECRET: ${JWT_SECRET:-orbispm-dev-jwt-secret-32chars!!}
      MINIO_ENDPOINT: "${MINIO_ENDPOINT}"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-orbispm}
      MINIO_USE_SSL: "${MINIO_USE_SSL:-true}"
      MINIO_PUBLIC_URL: "${MINIO_SERVER_URL}/${MINIO_BUCKET:-orbispm}"
      MEILI_URL: "http://${MEILI_HOST:-meilisearch}:7700"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterkey-for-dev-only}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: "${SMTP_PORT:-1025}"
      SMTP_FROM: ${SMTP_FROM:-noreply@orbispm.local}
      SMTP_ENABLED: "${SMTP_ENABLED:-true}"
      RATE_LIMIT_PER_MINUTE: "${RATE_LIMIT_PER_MINUTE:-100}"
      RATE_LIMIT_BURST: "${RATE_LIMIT_BURST:-20}"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_ENABLED: "${STRIPE_ENABLED:-false}"
    depends_on:
      zitadel-api:
        condition: service_healthy

  kong:
    image: kong/kong-gateway:3.9
    restart: unless-stopped
    ports:
      - "${KONG_PROXY_PORT:-8000}:8000"
      - "${KONG_SSL_PORT:-8443}:8443"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      KONG_LOG_LEVEL: ${KONG_LOG_LEVEL:-info}
    volumes:
      - ./kong.yml:/kong/kong.yml:ro
    depends_on:
      - zitadel-api
      - api
      - nocodb

  nocodb:
    image: nocodb/nocodb:latest
    restart: unless-stopped
    ports:
      - "${NOCODB_PORT:-8082}:8080"
    environment:
      NC_DB: "pg://${POSTGRES_HOST}:${POSTGRES_PORT}?u=${POSTGRES_USER}&p=${POSTGRES_PASSWORD}&d=${POSTGRES_DB}"
      NC_PUBLIC_URL: "${BASE_URL:-http://localhost:8000}/db"
      NC_DISABLE_TELE: "true"
    volumes:
      - nocodbdata:/usr/app/data

volumes:
  meilidata:
  nocodbdata:
