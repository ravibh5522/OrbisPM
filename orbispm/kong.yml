_format_version: "3.0"
_transform: true

services:
  # Zitadel Console UI
  - name: zitadel
    url: http://zitadel:8080
    routes:
      - name: zitadel-console
        paths:
          - /zitadel
        strip_path: true
        preserve_host: false

  # SSE endpoint — long-lived streaming, must come BEFORE generic /api route
  - name: backend-sse
    url: http://api:8080
    read_timeout: 86400000
    write_timeout: 86400000
    connect_timeout: 10000
    routes:
      - name: backend-sse-route
        paths:
          - ~/api/v1/orgs/[^/]+/events/stream
        strip_path: false
        preserve_host: false
        regex_priority: 200
    plugins:
      - name: rate-limiting
        config:
          minute: 15
          policy: local
          fault_tolerant: true
          hide_client_headers: false

  # Go Backend API
  - name: backend-api
    url: http://api:8080
    routes:
      - name: backend-api-routes
        paths:
          - /api
        strip_path: false
        preserve_host: false
    plugins:
      - name: rate-limiting
        config:
          minute: 200
          policy: local
          fault_tolerant: true
          hide_client_headers: false

  # WebSocket endpoint — long-lived, must come BEFORE generic /api route
  - name: backend-ws
    url: http://api:8080
    read_timeout: 86400000
    write_timeout: 86400000
    connect_timeout: 10000
    routes:
      - name: backend-ws-route
        paths:
          - ~/api/v1/orgs/[^/]+/ws$
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        regex_priority: 200
    plugins:
      - name: rate-limiting
        config:
          minute: 30
          policy: local
          fault_tolerant: true
          hide_client_headers: false

  # Storage (MinIO) proxy for direct file access
  - name: storage
    url: http://minio:9000
    routes:
      - name: storage-route
        paths:
          - /storage
        strip_path: true
        preserve_host: false
    plugins:
      - name: rate-limiting
        config:
          minute: 120
          policy: local
          fault_tolerant: true
          hide_client_headers: false

  # NocoDB UI
  - name: nocodb
    url: http://nocodb:8080
    routes:
      - name: nocodb-route
        paths:
          - /db
        strip_path: true
        preserve_host: false
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          policy: local
          fault_tolerant: true
          hide_client_headers: false

plugins:
  - name: cors
    config:
      origins:
        - http://localhost:3000
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
        - HEAD
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-Requested-With
        - X-Org-ID
        - apikey
      exposed_headers:
        - X-Total-Count
        - X-Request-Id
        - RateLimit-Limit
        - RateLimit-Remaining
        - RateLimit-Reset
      credentials: true
      max_age: 3600
      preflight_continue: false
