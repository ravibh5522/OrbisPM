# =======================================================
# Dashboard Service — Grafana
# =======================================================

services:
  # Grafana — Visualization and dashboards
  grafana:
    image: grafana/grafana:10.4.0
    container_name: orbispm-grafana
    # ONLY external-facing monitoring port
    ports:
      - "3003:3000"
    environment:
      # Admin credentials
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-changeme}

      # Server settings
      GF_SERVER_ROOT_URL: ${GF_ROOT_URL:-http://localhost:3003}
      GF_SERVER_DOMAIN: localhost

      # Security settings
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SECURE: "false"  # Set true in production with HTTPS
      GF_AUTH_ANONYMOUS_ENABLED: "false"

      # Feature toggles
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor tempoSearch tempoServiceGraph"

      # Database (embedded SQLite by default)
      GF_DATABASE_TYPE: sqlite3

      # Plugins
      GF_INSTALL_PLUGINS: "grafana-clickhouse-datasource"

      # Logging
      GF_LOG_MODE: console
      GF_LOG_LEVEL: info

      # Paths
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning

      # -------------------------------------------------
      # Production: Enable Zitadel OAuth
      # -------------------------------------------------
      # GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      # GF_AUTH_GENERIC_OAUTH_NAME: "Zitadel"
      # GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${ZITADEL_CLIENT_ID}
      # GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${ZITADEL_CLIENT_SECRET}
      # GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email"
      # GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://${ZITADEL_DOMAIN}/oauth/v2/authorize
      # GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://${ZITADEL_DOMAIN}/oauth/v2/token
      # GF_AUTH_GENERIC_OAUTH_API_URL: https://${ZITADEL_DOMAIN}/oidc/v1/userinfo
      # GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"

    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - prometheus
      - loki
      - tempo

networks:
  monitoring:
    external: false
    name: orbispm-monitoring_monitoring

volumes:
  grafana-data:
    external: false
    name: orbispm-monitoring_grafana-data
