# =======================================================
# Alerting Service — Custom Go Engine + Alertmanager
# =======================================================

services:
  # Custom Alert Engine — Evaluates metrics, logs, business rules
  alert-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orbispm-alert-engine
    environment:
      # Database
      DATABASE_URL: "postgres://${POSTGRES_USER:-orbispm}:${POSTGRES_PASSWORD:-changeme}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-orbispm}?sslmode=disable"

      # Redis
      REDIS_URL: "redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"

      # Monitoring endpoints
      PROMETHEUS_URL: "http://prometheus:9090"
      LOKI_URL: "http://loki:3100"
      ALERTMANAGER_URL: "http://alertmanager:9093"

      # Evaluation settings
      EVAL_INTERVAL: "30s"
      ALERT_COOLDOWN: "15m"

      # Logging
      LOG_LEVEL: "info"
      ENV: "${ENV:-development}"
    # Internal only — no host port mapping
    expose:
      - "8090"
    networks:
      - monitoring
      - orbispm_default
    deploy:
      resources:
        limits:
          memory: 128m
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://localhost:8090/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - alertmanager

  # Alertmanager — Alert routing and notifications
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: orbispm-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://localhost:9093
      - --cluster.listen-address=
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    # Internal only — no host port mapping
    expose:
      - "9093"
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  monitoring:
    external: false
    name: orbispm-monitoring_monitoring
  orbispm_default:
    external: false

volumes:
  alertmanager-data:
    external: false
    name: orbispm-monitoring_alertmanager-data
