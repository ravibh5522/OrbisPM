# =======================================================
# Analytics DB Service — ClickHouse
# =======================================================

services:
  # ClickHouse — Analytics database
  clickhouse:
    image: clickhouse/clickhouse-server:24.2
    container_name: orbispm-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-monitoring}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./config/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
      - ./init/:/docker-entrypoint-initdb.d/:ro
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    # Internal only — no host port mapping
    expose:
      - "8123"  # HTTP interface
      - "9000"  # Native protocol
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 2g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8123/ping | grep -q 'Ok' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

networks:
  monitoring:
    external: false
    name: orbispm-monitoring_monitoring

volumes:
  clickhouse-data:
    external: false
    name: orbispm-monitoring_clickhouse-data
  clickhouse-logs:
    external: false
    name: orbispm-monitoring_clickhouse-logs
