# =======================================================
# Tracing Service — Grafana Tempo
# =======================================================

services:
  # Grafana Tempo — Distributed tracing backend
  tempo:
    image: grafana/tempo:2.4.0
    container_name: orbispm-tempo
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes:
      - ./tempo/tempo-config.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
    # Internal only — no host port mapping
    expose:
      - "3200"   # HTTP
      - "4317"   # OTLP gRPC
      - "4318"   # OTLP HTTP
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3200/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  monitoring:
    external: false
    name: orbispm-monitoring_monitoring

volumes:
  tempo-data:
    external: false
    name: orbispm-monitoring_tempo-data
