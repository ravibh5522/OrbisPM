# =======================================================
# Grafana Tempo Configuration
# =======================================================
# Distributed tracing backend

server:
  http_listen_port: 3200

# Distributor settings
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

# Ingester settings
ingester:
  max_block_duration: 5m
  max_block_bytes: 1073741824  # 1GB

# Query frontend settings
query_frontend:
  search:
    duration_slo: 5s
    throughput_bytes_slo: 1073741824
  trace_by_id:
    duration_slo: 5s

# Querier settings
querier:
  frontend_worker:
    frontend_address: "localhost:9095"

# Storage configuration
storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
    block:
      bloom_filter_false_positive: 0.05
      v2_index_downsample_bytes: 1000
      v2_encoding: zstd

# Compactor settings
compactor:
  compaction:
    block_retention: 168h  # 7 days (increase for production)
    compacted_block_retention: 1h
    compaction_window: 1h
    max_block_bytes: 107374182400  # 100GB
  ring:
    kvstore:
      store: inmemory

# Metrics generator for RED metrics
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

# Overrides and limits
overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics
    ingestion:
      rate_limit_bytes: 15000000  # 15MB/s
      burst_size_bytes: 20000000  # 20MB

# Global limits
# Usage report (optional)
usage_report:
  reporting_enabled: false
