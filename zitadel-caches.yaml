# ============================================================
# Zitadel v4 — Caches configuration overlay
# Mounted via: --config /zitadel-caches.yaml
# PascalCase keys matching cmd/defaults.yaml for reliable merge.
# ============================================================
Caches:
  Connectors:
    Redis:
      Enabled: true
      Addr: "zitadel-redis:6379"
      MaxRetries: 5
      MinRetryBackoff: "50ms"
      MaxRetryBackoff: "1s"
      DialTimeout: "10s"
      ReadTimeout: "5s"
      WriteTimeout: "5s"
      PoolSize: 10
      PoolTimeout: "10s"
      MinIdleConns: 0
      MaxIdleConns: 5
      MaxActiveConns: 40
      ConnMaxIdleTime: "30m"
      ConnMaxLifetime: "0s"
      # Disable circuit breaker auto-trip.
      # go-redis 9.16 sends CLIENT MAINT_NOTIFICATIONS during handshake;
      # Redis 7 rejects it with "ERR unknown subcommand" which the CB
      # redis.Limiter.ReportResult counts as a failure, tripping the CB
      # before any real cache operation occurs.
      # Setting both to 0 makes readyToTrip() always return false.
      CircuitBreaker:
        MaxConsecutiveFailures: 0
        MaxFailureRatio: 0
        Timeout: "60s"
        Interval: "60s"
        MaxRetryRequests: 5
  Instance:
    Connector: "redis"
    MaxAge: "1h"
    LastUseAge: "10m"
  Milestones:
    Connector: "redis"
    MaxAge: "1h"
    LastUseAge: "10m"
  Organization:
    Connector: "redis"
    MaxAge: "1h"
    LastUseAge: "10m"
